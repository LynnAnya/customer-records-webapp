<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original geometric background for the login panel. Lines only; the navy comes from CSS.
       Everything stays in the corners, away from the text in the middle. -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Dot grid in the top-right corner -->
  <rect x="500" y="40" width="270" height="220" fill="url(#dots)"/>
  <!-- Rings in the bottom-right corner, away from the footer text -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <circle cx="800" cy="1000" r="90"/>
    <circle cx="800" cy="1000" r="150"/>
    <circle cx="800" cy="1000" r="210"/>
  </g>
  <!-- One amber arc as the single warm accent -->
  <path d="M 800 820 A 180 180 0 0 0 620 1000" fill="none" stroke="#ffb01f" stroke-opacity="0.6" stroke-width="3"/>
  <!-- Diagonal hairlines in the top-left corner -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <path d="M -40 200 L 200 -40"/>
    <path d="M -40 260 L 260 -40"/>
  </g>
</svg>
