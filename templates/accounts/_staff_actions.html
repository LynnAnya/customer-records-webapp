{# Buttons for one account. Your own password is changed under ตั้งค่า, not here. #}
<a class="btn btn-outline min-h-10 px-3 text-sm" href="{% url 'staff_edit' person.pk %}">แก้ไข</a>
{% if person.pk != request.user.pk %}
<a class="btn btn-outline min-h-10 px-3 text-sm" href="{% url 'staff_reset_password' person.pk %}">ตั้งรหัสผ่านใหม่</a>
<form method="post" action="{% url 'staff_set_active' person.pk %}" class="inline">
  {% csrf_token %}
  <input type="hidden" name="active" value="{% if person.is_active %}0{% else %}1{% endif %}">
  {% if person.is_active %}
  <button type="submit" class="btn btn-outline min-h-10 px-3 text-sm text-danger">ปิดใช้งาน</button>
  {% else %}
  <button type="submit" class="btn btn-outline min-h-10 px-3 text-sm">เปิดใช้งาน</button>
  {% endif %}
</form>
{% endif %}
