{# App mark, name and purpose. `tone` is "rail" on dark navy, empty on a normal surface. #}
<span class="flex items-center gap-3">
  <span class="flex size-10 flex-none items-center justify-center rounded-xl bg-signal text-[#3a2600]">
    <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 12h4"/><path d="M14 12h3"/></svg>
  </span>
  <span class="flex flex-col">
    <span class="text-lg font-bold leading-tight {% if tone == 'rail' %}text-white{% else %}text-ink{% endif %}">Customer Records</span>
    <span class="text-sm leading-tight {% if tone == 'rail' %}text-rail-ink{% else %}text-muted{% endif %}">ระบบข้อมูลลูกค้า</span>
  </span>
</span>
