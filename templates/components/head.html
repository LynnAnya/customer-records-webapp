{% load static assets %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
{# `asset` adds a version to the address, so a changed file is never served from an old browser cache. #}
{# Not deferred on purpose: sets the theme and sidebar state before the page is painted. #}
<script src="{% asset 'js/app.js' %}"></script>
<link rel="preload" href="{% static 'fonts/noto-sans-thai-thai-wght.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% asset 'css/app.css' %}">
<script defer src="{% static 'js/htmx-2.0.11.min.js' %}"></script>
<script defer src="{% static 'js/alpine-3.17.5.min.js' %}"></script>
