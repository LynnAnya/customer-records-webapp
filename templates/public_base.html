<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}ลงทะเบียนลูกค้า{% endblock %}</title>
  {# Temporary plain styles. Replaced by Tailwind and the real design in build step 4. #}
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 18px; line-height: 1.6; background: #f3f4f6; color: #111827; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text] { width: 100%; min-height: 48px; padding: 10px 12px; font-size: 18px; border: 1px solid #9ca3af; border-radius: 10px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .consent { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; }
    .consent input { width: 24px; height: 24px; margin-top: 4px; flex: none; }
    .error { color: #b91c1c; font-size: 16px; margin: 4px 0 0; }
    .alert { background: #fee2e2; color: #7f1d1d; padding: 12px; border-radius: 10px; margin-bottom: 16px; }
    button { width: 100%; min-height: 52px; font-size: 18px; font-weight: 600; color: #fff; background: #1d4ed8; border: 0; border-radius: 12px; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
